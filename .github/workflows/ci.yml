name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-timeout:
        description: 'go test timeout (seconds)'
        required: false
        default: '300'
        type: string

env:
  GO_TEST_TIMEOUT: ${{ inputs.test-timeout || '300' }}s

jobs:
  # ── Tier 0: fast gate — build + vet + unit tests on every push ──
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe --tags` can resolve the nearest tag
          # for the version-authority check (GAP-038).
          fetch-depth: 0

      # Toolchain sourced from go.mod (QA-BUNKER-15): the declared CI version must match the
      # required one, or every job silently GOTOOLCHAIN-downloads a second toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # INT-CI-024: BSR rate limiting (`resource_exhausted: too many requests`)
      # failed this step in root-suite + regression on runs 35496282840 /
      # 35496107562, while run-level conclusion stayed success. Mitigation,
      # identical in every job of this file:
      #   1. actions/cache restores proto/ keyed on the proto input hash; the
      #      step then SKIPS `buf generate` entirely when the committed
      #      generated files are already current (cache hit, or the committed
      #      proto/.codegen-fresh stamp matching the current inputs) — no BSR
      #      call at all.
      #   2. When regeneration IS needed, .github/scripts/ensure-proto.sh
      #      retries a BSR resource_exhausted failure with exponential backoff
      #      + jitter (5 attempts) and still fails the job loudly on retry
      #      exhaustion or any other buf error.
      # BUF_TOKEN: none exists in this repo (verified); the script never
      # requires it.
      - name: Restore generated protobuf code cache
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: proto
          key: proto-gen-v1-${{ hashFiles('**/*.proto', 'buf.gen.yaml') }}

      - name: Generate protobuf code
        env:
          PROTO_CACHE_HIT: ${{ steps.proto-cache.outputs.cache-hit }}
        run: bash .github/scripts/ensure-proto.sh

      - name: Build
        run: go build ./...

      # CLI surface smoke (GAP-035/GAP-036): a fresh build must expose
      # --version and the ssh/systemd commands the README documents.
      - name: CLI surface smoke
        run: |
          go build -o /tmp/bunker-smoke ./cmd/bunker
          /tmp/bunker-smoke --version >/dev/null
          /tmp/bunker-smoke --help | grep -q '^  ssh'
          /tmp/bunker-smoke --help | grep -q '^  systemd'

      # Binary freshness guard (GAP-051, GAP-036 regression): stale
      # gitignored prebuilt binaries must never sit at the repo root — they
      # re-materialized twice (0.1.2/5b759c4 vs HEAD) and silently served old
      # behavior. Any binary that IS present fails the job, and a fresh build
      # must report the HEAD commit (proves version injection is live).
      - name: Binary freshness guard
        run: |
          set -euo pipefail
          if [ -e bunker ] || [ -e bunkerd ]; then
            echo "stale prebuilt binary at repo root (gitignored):" >&2
            ls -la bunker bunkerd >&2
            exit 1
          fi
          head_commit=$(git rev-parse --short HEAD)
          bin_commit=$(/tmp/bunker-smoke version | awk 'NR==2 {print $2}')
          echo "HEAD commit: ${head_commit} | built binary commit: ${bin_commit}"
          test "${bin_commit}" = "${head_commit}"

      # Version-authority check (GAP-038): the latest git tag, `bunker
      # version`, and the CHANGELOG top heading must all report the same
      # semver — otherwise upgrade/breaking-change decisions have no ground
      # truth. Needs fetch-depth: 0 (above) for git describe.
      # INT-CI-001: cli_version extraction no longer pipes multi-line
      # `bunker version` output through `head -1` — head closes the pipe
      # early, the producer gets SIGPIPE, and `set -euo pipefail` turns that
      # into exit 141 (flake class GAP-043). awk consumes the full stream.
      - name: Version authority check
        run: |
          set -euo pipefail
          # QA-BUNKER-13: no tags in the checkout (act run / shallow clone /
          # fresh fork / tarball) would kill this step with exit 128 under
          # `set -euo pipefail`. Hosted CI fetches full depth (fetch-depth: 0)
          # and enforces the parity check there; tag-less checkouts skip it
          # with a visible warning annotation instead of failing the job.
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "::warning::no tags in checkout (act/shallow/fork) — version-authority parity check skipped (hosted CI runs full-depth fetch-depth: 0 and enforces it)"
            exit 0
          fi
          latest_tag=$(git describe --tags --abbrev=0)
          cli_version=$(/tmp/bunker-smoke version | awk 'NR==1 {print $2}')
          # GAP-081: the CHANGELOG's top heading is `## Unreleased` while commits
          # sit past the newest release tag, so the parity check must read the
          # newest RELEASE heading, not the first heading of any kind.
          changelog_top=$(grep -m1 -E '^## [0-9]' CHANGELOG.md | awk '{print $2}')
          echo "latest tag: ${latest_tag} | bunker version: ${cli_version} | CHANGELOG: ${changelog_top}"
          test "${latest_tag}" = "v${cli_version}"
          test "${cli_version}" = "${changelog_top}"

      # Tag build check (GAP-041): `go install @latest` resolves to the latest
      # tag, so the tag itself must build a binary with the documented version
      # and CLI surface — a tag cut from a pre-bump commit silently ships an
      # old binary, and a force-moved tag does not refresh the module proxy's
      # cached zip (GAP-043). The expected version is derived from the tag
      # name, so future tags need no CI edit. Builds from the tag tree via
      # git archive, not from HEAD.
      - name: Tag build check
        run: |
          set -euo pipefail
          # QA-BUNKER-13: same no-tag guard as the version-authority step —
          # without tags `git describe` exits 128 under `set -euo pipefail`.
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            echo "::warning::no tags in checkout (act/shallow/fork) — tag build check skipped (hosted CI runs full-depth fetch-depth: 0 and enforces it)"
            exit 0
          fi
          latest_tag=$(git describe --tags --abbrev=0)
          expected=$(echo "${latest_tag#v}")
          git show "${latest_tag}:internal/version/version.go" | grep -q "Version = \"${expected}\""
          if ! git ls-tree -r --name-only "${latest_tag}" | grep 'internal/cli/ssh.go' >/dev/null; then
            echo "tag tree missing internal/cli/ssh.go"; exit 1
          fi
          if ! git ls-tree -r --name-only "${latest_tag}" | grep 'internal/cli/systemd.go' >/dev/null; then
            echo "tag tree missing internal/cli/systemd.go"; exit 1
          fi
          tag_dir=$(mktemp -d)
          git archive "${latest_tag}" | tar -x -C "${tag_dir}"
          (cd "${tag_dir}" && go build -o /tmp/bunker-tag-bin ./cmd/bunker)
          /tmp/bunker-tag-bin version | grep -q "^bunker ${expected}"
          /tmp/bunker-tag-bin --help | grep -q '^  ssh'
          /tmp/bunker-tag-bin --help | grep -q '^  systemd'
          echo "tag build check OK: ${latest_tag}"

      # Docs release-drift check (GAP-081): the README's documented CLI surface
      # must be the one `go install ...@latest` actually installs. Fails when a
      # documented command is absent from the newest release tag's internal/cli
      # tree and its block is not marked "requires a build from HEAD", when the
      # README names a release tag older than `git describe --tags --abbrev=0`,
      # or when commits exist past that tag and CHANGELOG.md carries no
      # `## Unreleased` section. Offline and deterministic; the same rules are
      # unit-tested in internal/docscheck. Tag-less checkouts (act/shallow/fork)
      # exit 0 with a visible warning, like the two checks above.
      - name: Docs release-drift check (GAP-081)
        run: go run ./cmd/docs-drift

      - name: Vet
        run: go vet ./...

      # golangci-lint runs locally via `golangci-lint run`. The .golangci.yml
      # config is committed for editor integration and pre-commit hooks.

  # ── Tier 0b: unit tests — split out of build-and-test (INT-CI-017) ──
  # A flaky unit assertion used to fail build-and-test, which gates
  # gitreins-guard/regression/root-suite via `needs:` — so one flake silently
  # stripped all three coverage layers from that push (run 35253802213 on
  # 58546f5: build-and-test=failure, the other three=skipped). The downstream
  # jobs need a COMPILING TREE, not passing unit tests, and they get that from
  # build-and-test. A genuine unit-test failure still fails the workflow run —
  # this job deliberately carries NO continue-on-error.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore generated protobuf code cache
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: proto
          key: proto-gen-v1-${{ hashFiles('**/*.proto', 'buf.gen.yaml') }}

      - name: Generate protobuf code
        env:
          PROTO_CACHE_HIT: ${{ steps.proto-cache.outputs.cache-hit }}
        run: bash .github/scripts/ensure-proto.sh

      - name: Unit tests
        run: go test -count=1 -short ./... -timeout ${{ env.GO_TEST_TIMEOUT }}
        timeout-minutes: 10

      # DF-BUNKER-25: install.sh is the documented first path for a fresh host,
      # so its suite is a required step (same entry point as `make test-sh`).
      # Network-free: it drives --from-dir fixtures, a file:// mirror of the
      # release layout, and a Go-less PATH probe for the --build refusal.
      - name: Installer tests (scripts/install_test.sh)
        run: bash scripts/install_test.sh
        timeout-minutes: 5

  # ── Tier 1: GitReins guard — secrets, lint, tests ──
  gitreins-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitReins
        run: pip install gitreins

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore generated protobuf code cache
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: proto
          key: proto-gen-v1-${{ hashFiles('**/*.proto', 'buf.gen.yaml') }}

      - name: Generate protobuf code
        env:
          PROTO_CACHE_HIT: ${{ steps.proto-cache.outputs.cache-hit }}
        run: bash .github/scripts/ensure-proto.sh

      - name: GitReins Tier 1 guard
        run: gitreins guard

  # ── Regression + E2E (self-hosted runner only — requires Linux host) ──
  # This job runs ONLY when a self-hosted runner with the 'bunker' label is
  # connected. RELEASE-001: it is REQUIRED — a real failure here fails the
  # workflow run. The continue-on-error mask that used to sit on this job made
  # run 35500211074 report conclusion=success while the job itself was FAILURE
  # (12 PASS / 17 FAIL), and run 35518195177 the same. Per-job conclusions are
  # the only truth; the run conclusion lied.
  regression:
    runs-on: [self-hosted, Linux, bunker]
    timeout-minutes: 30
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore generated protobuf code cache
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: proto
          key: proto-gen-v1-${{ hashFiles('**/*.proto', 'buf.gen.yaml') }}

      - name: Generate protobuf code
        env:
          PROTO_CACHE_HIT: ${{ steps.proto-cache.outputs.cache-hit }}
        run: bash .github/scripts/ensure-proto.sh

      # Runner runs as root; workspace checkout is owned by actions-runner —
      # git refuses "dubious ownership" otherwise (exit 128 on go build VCS).
      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build binaries
        run: go build -o bunkerd ./cmd/bunkerd && go build -o bunker ./cmd/bunker

      # GAP-075 / regression wiring: regression-tests.sh invokes BARE `bunker`
      # and `bunkerd`, so the runner resolves them through PATH. That resolved
      # to the stale /usr/local host baseline — a build predating the
      # private-/tmp + PAM boundary runtime setup — and on run 34778344738 job
      # 103780758333 died with 31 PASS / 2 FAIL (`exec whoami returns agent
      # username`, `exec propagates exit code`) so the E2E battery was skipped.
      # Put this job's just-built workspace binaries FIRST on PATH and prove the
      # resolution before the suite runs, so the regression always exercises
      # the pushed commit instead of the runner's /usr/local baseline.
      # Pinned by internal/hostsetup/ciwiring_test.go.
      - name: Regression suite
        env:
          BUNKERD_COEXIST: "1"
          BUNKERD_GRPC_ADDR: ":29090"
          BUNKERD_REST_ADDR: ":28080"
        run: |
          export PATH="${GITHUB_WORKSPACE}:${PATH}"
          command -v bunker bunkerd
          test "$(command -v bunker)" = "${GITHUB_WORKSPACE}/bunker"
          test "$(command -v bunkerd)" = "${GITHUB_WORKSPACE}/bunkerd"
          bash regression-tests.sh
        timeout-minutes: 10

      # INT-CI-003: the battery defaults to /usr/local/bin/bunker{,d}, which is a
      # stale host build lacking newer CLI surface (--image-spec), so section 13
      # failed 9 cells while the run still reported success (continue-on-error).
      # Point it at the binaries this job just built from the pushed commit.
      - name: E2E battery
        env:
          BUNKERD_COEXIST: "1"
          BUNKERD_GRPC_ADDR: ":29091"
          BUNKERD_REST_ADDR: ":28081"
          BUNKER_BIN: ${{ github.workspace }}/bunker
          BUNKERD_BIN: ${{ github.workspace }}/bunkerd
          # CI builds BUNKER_BIN from the pushed commit, so a certification
          # MISMATCH here is a real defect, not a deployment mode.
          BUNKER_STRICT_BIN: "1"
        run: bash e2e-full-battery.sh
        timeout-minutes: 15

  # ── Root-gated suite (spawn/cgroup/concurrency) — needs root ──
  # Runs on the self-hosted bunker-mvp runner, which runs as root (the
  # regression battery requires root by design). Prevents the 17 root-gated
  # tests (TestSpawn*/TestCgroup*/TestConcurrency*) from being skipped in CI.
  # Baseline evidence: docs/dogfood/2026-08-04-gap-001-root-e2e.md
  # RELEASE-001: REQUIRED — the continue-on-error mask is gone, so a failure in
  # this suite fails the workflow run instead of reporting success.
  root-suite:
    runs-on: [self-hosted, Linux, bunker]
    timeout-minutes: 30
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore generated protobuf code cache
        id: proto-cache
        uses: actions/cache@v4
        with:
          path: proto
          key: proto-gen-v1-${{ hashFiles('**/*.proto', 'buf.gen.yaml') }}

      - name: Generate protobuf code
        env:
          PROTO_CACHE_HIT: ${{ steps.proto-cache.outputs.cache-hit }}
        run: bash .github/scripts/ensure-proto.sh

      # Runner runs as root; workspace checkout is owned by actions-runner —
      # git refuses "dubious ownership" otherwise (exit 128 on go build VCS).
      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Root-gated suite (TestSpawn|TestCgroup|TestConcurrency)
        # Wrapper guarantees 0 leaked users/keys even when a test leaks or
        # fails mid-way (GAP-007); see scripts/root-suite.sh.
        run: bash scripts/root-suite.sh
        timeout-minutes: 15

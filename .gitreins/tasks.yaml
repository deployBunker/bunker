    path)'
  criteria:
  - 'Five conjuncts, all documented in the repo and reproduced by the evaluator itself:
    (1) bunker tunnel runs ssh under a signal-aware context (os.Interrupt/SIGTERM/SIGHUP)
    with NO deadline, and the 30s GetAgent RPC deadline is cancelled immediately after

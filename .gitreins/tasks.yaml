    spawns a grandchild and waits, SIGTERMs the CLI and asserts no descendant survives
    - and that test FAILS against the pre-fix code; (3) a parent-death backstop cmd.SysProcAttr.Pdeathsig
    = syscall.SIGKILL is armed on linux/freebsd behind a build tag (documented no-op
    on the other POSIX platforms, windows untouched) and the child is started from
    an OS thread pinned with runtime.LockOSThread for the tunnel''s lifetime, so a
    SIGKILLed CLI cannot orphan the ssh process holding the -L docker.sock forward;
    a real-process SIGKILL test proves the direct child dies and fails when the Pdeathsig
    assignment is removed; (4) e2e-full-battery.sh section 6a launches the tunnel
    under setsid and tears down its process group, keeping the section''s assertions
    and banners unchanged; (5) gofmt clean, go build ./... , go vet ./... and go test

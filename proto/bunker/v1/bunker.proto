syntax = "proto3";

package bunker.v1;

option go_package = "github.com/deployBunker/bunker/proto/bunker/v1;bunkerv1";

// ── Bunkerd — Server Daemon API ───────────────────────────────

service Bunkerd {
  // Server management
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
  rpc ServerMetrics(ServerMetricsRequest) returns (ServerMetricsResponse);

  // Agent lifecycle
  rpc SpawnAgent(SpawnAgentRequest) returns (SpawnAgentResponse);
  // DF-BUNKER-34: the renewal drift report. Scans an agent home for
  // references to a given (old) home path across the artifact classes a
  // renewal goes stale in — systemd --user units, cron entries, shell/env
  // and config files. Read-only: it reports, it never rewrites.
  rpc RenewalDriftReport(RenewalDriftRequest) returns (RenewalDriftResponse);
  rpc DestroyAgent(DestroyAgentRequest) returns (DestroyAgentResponse);
  // GAP-071: pause / resume / restart an agent WITHOUT destroying it.
  //   stop    — SIGTERM the agent's session units + processes; the Linux user,
  //             home directory, container and allocated port range all SURVIVE
  //             (status becomes "stopped"; the tracker record is kept);
  //   start   — re-arm a stopped agent (status back to "running");
  //   restart — stop + start in one call and reset the heartbeat expiry.
  // Exec/Run/Heartbeat against a stopped agent fail with a DISTINCT
  // FailedPrecondition carrying the token "agent_stopped" — never NotFound.
  rpc StopAgent(StopAgentRequest) returns (StopAgentResponse);
  rpc StartAgent(StartAgentRequest) returns (StartAgentResponse);
  rpc RestartAgent(RestartAgentRequest) returns (RestartAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  // GAP-128: explicit retrieval of an agent's SSH private key (spawn no
  // longer returns it by default). Master-credential gated like the other
  // Bunkerd RPCs.
  rpc GetAgentKey(GetAgentKeyRequest) returns (GetAgentKeyResponse);

  // Agent actions
  rpc AgentMetrics(AgentMetricsRequest) returns (AgentMetricsResponse);
  rpc ExecAgent(ExecAgentRequest) returns (stream ExecAgentResponse);
  rpc RunAgent(RunAgentRequest) returns (RunAgentResponse);
  rpc HeartbeatAgent(HeartbeatAgentRequest) returns (HeartbeatAgentResponse);

  // Audit trail
  rpc QueryAudit(QueryAuditRequest) returns (QueryAuditResponse);

  // Key lifecycle (GAP-132). All three are MASTER-auth-gated: they sit on the
  // Bunkerd service, so the master-only interceptor rejects agent-scoped
  // sub-keys before the handler runs (CodeUnauthenticated), exactly like
  // SpawnAgent / GetAgentKey.
  //
  // RotateJWTSecret swaps the HS256 signing secret WITHOUT downtime: the new
  // secret signs immediately, while the retired one keeps VALIDATING tokens
  // for a bounded overlap window (dual accept). The new secret is returned
  // in the response exactly once — the daemon itself never echoes it again.
  // RevokeKey kills an API sub-key (and the credentials issued under it)
  // immediately; KeyList reports active keys without any secret material.
  rpc RotateJWTSecret(RotateJWTSecretRequest) returns (RotateJWTSecretResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);
  rpc KeyList(KeyListRequest) returns (KeyListResponse);
}

// ── Agent Service (scoped sub-key access) ─────────────────────

service Agent {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Metrics(AgentMetricsRequest) returns (AgentMetricsResponse);
  rpc Heartbeat(HeartbeatAgentRequest) returns (HeartbeatAgentResponse);
}

// ── Resource limits ───────────────────────────────────────────

message ResourceLimits {
  double cpu_quota = 1;        // CPU quota (cores), e.g. 2.0
  uint64 memory_max_bytes = 2;  // Memory limit in bytes
  // disk_max_bytes is a PER-FILE size cap, not a total-disk quota: it is
  // applied on the host as systemd LimitFSIZE (RLIMIT_FSIZE), bounding the
  // size of any single file. Nothing caps an agent's TOTAL on-disk usage
  // (real per-user filesystem quotas are GAP-161, not implemented), so a
  // value of N does not bound the agent to N bytes — present it as a
  // per-file cap, never as a disk limit (DF-BUNKER-54).
  uint64 disk_max_bytes = 3;
  uint32 max_docker_containers = 4; // Max concurrent Docker containers
}

// ── Network configuration ─────────────────────────────────────

message NetworkConfig {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CLOUDFLARE_TUNNEL = 1;  // Cloudflare Tunnel (named or TryCloudflare)
    MODE_TAILSCALE = 2;          // Tailscale mesh
    MODE_DIRECT = 3;             // Direct port (behind load balancer)
  }
  Mode mode = 1;
  string domain = 2;              // Optional: custom domain for Cloudflare
  bool trycloudflare = 3;         // Use anonymous TryCloudflare tunnel
  uint32 port_range_start = 4;    // Start of per-agent port range
  uint32 port_range_end = 5;      // End of per-agent port range
}

// ── Server info ───────────────────────────────────────────────

message ServerInfoRequest {}

message ServerInfoResponse {
  string hostname = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
  uint32 agent_count = 4;
  uint32 max_agents = 5;
  ResourceLimits total_resources = 6;
  ResourceLimits available_resources = 7;
  // /tmp isolation the daemon actually enforces for agent sessions
  // (DF-BUNKER-9). "private" = per-session pam_namespace instance provisioned
  // and enforced; "host-shared" = agent sessions see the host /tmp; "unknown"
  // = the state could not be verified (e.g. the daemon is not root). An EMPTY
  // value means the daemon predates capability reporting (any tagged v0.1.x
  // release) — the README's private-/tmp promise does NOT hold on it.
  string tmp_isolation = 8;
  // Short human-readable reason/context for tmp_isolation (empty for
  // "private"; the failing provisioning reason for "host-shared"; the
  // verification failure for "unknown").
  string tmp_isolation_detail = 9;
  // Residue inventory (DF-BUNKER-21). Host state left behind by agents the
  // daemon does not know about: orphan users, homes, keys and linger entries.
  // UNSET (nil) means the daemon predates residue reporting — an older CLI must
  // not read absence of the field as "the host is clean".
  ResidueInventory residue = 10;
}

// ResidueInventory reports host residue counts probed from the host itself
// (never from a bookkeeping counter), so an operator can see what a failed
// spawn, a crash or a partially rolled-back agent left behind.
message ResidueInventory {
  // Managed (bunker-*) system users the daemon does not know: neither tracked
  // live nor present in the durable registry.
  uint32 orphan_users = 1;
  // Managed home directories whose agent the daemon does not know. Includes
  // homes left by `userdel` without -r, i.e. a home with no user at all.
  uint32 orphan_homes = 2;
  // Persisted agent SSH private keys whose agent the daemon does not know.
  uint32 orphan_keys = 3;
  // systemd linger entries for managed agent users the daemon does not know —
  // the state that makes logind resurrect a user manager for a dead agent.
  uint32 stale_linger_entries = 4;
  // Agents the daemon knows (tracker + durable registry). The denominator:
  // "11 orphan users / 0 registered" is the leak fingerprint this field exists
  // to make legible.
  uint32 registered_agents = 5;
  // Probe status (DF-BUNKER-21): "ok" = every plane was probed; "partial" =
  // at least one plane could not be read, so the counts are a LOWER BOUND;
  // "unavailable" = no plane could be read at all (counts are meaningless).
  // An empty value means the daemon predates residue reporting.
  string status = 6;
  // Names every plane that could not be probed and why. Empty for "ok".
  string detail = 7;
}

message ServerMetricsRequest {}

message ServerMetricsResponse {
  double cpu_usage_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint32 docker_containers_total = 6;
  repeated AgentSummary agents = 7;
}

// ── Agent ─────────────────────────────────────────────────────

message AgentSummary {
  string agent_id = 1;
  string status = 2;             // pending, starting, running, stopping, stopped, failed
  ResourceLimits limits = 3;
  string created_at = 4;
  string expires_at = 5;
  string sshfs_mount = 6;        // sshfs mount command
  string docker_host_tunnel = 7; // ssh -L tunnel command
  string public_url = 8;
  uint32 port_range_start = 9;
  uint32 port_range_end = 10;
  string tailnet_ip = 11;
  uint64 disk_used_bytes = 12;   // per-agent disk usage in bytes
  // GAP-116 effective safety preset: the resolved preset name (flag > env >
  // config global > built-in default "open") and the effective systemd knob
  // set the agent was spawned under. Additive: older clients ignore both.
  string safety_preset = 13;
  repeated SystemdProperty systemd_properties = 14;
  // MOUNT-006: explicit driver identity for the stored mount command.
  // ADDITIVE (older clients keep reading sshfs_mount = 6 and mount via
  // sshfs). Populated by agents spawned after the seam; a replayed
  // pre-seam record reports driver "sshfs" derived from the stored command.
  MountSpec mount_spec = 15;
  // DF-BUNKER-34 orphan-uid surfacing: when NON-EMPTY, the agent's user
  // record (bunker-<agent_id>) is GONE from the host while processes are
  // still running under its uid. The value names the uid and every live
  // process (pid + command head). Empty = healthy, unknown, or not
  // applicable (the home does not exist). ADDITIVE: older clients ignore it.
  string orphan_uid_detail = 16;
}

// One resolved systemd property of an agent's effective knob set (GAP-116):
// a NAME=VALUE pair as written into the spawn unit / slice drop-in, so
// `bunker info` reports exactly what systemd enforces.
message SystemdProperty {
  string name = 1;   // e.g. CPUQuota, MemoryMax, TasksMax, LimitNOFILE, LimitFSIZE
  string value = 2;  // e.g. "200%", "4294967296"
}

message SpawnAgentRequest {
  string agent_id = 1;           // Optional: auto-generated if empty
  ResourceLimits limits = 2;     // Optional: uses server defaults if empty
  NetworkConfig network = 3;     // Optional: uses server defaults if empty
  string ttl = 4;                // e.g. "6h", "24h", "7d"
  bytes ssh_public_key = 5;      // Optional: push existing key
  map<string, string> labels = 6;
  ImageSpec image_spec = 7;      // Optional: secure package-add customization (GAP-064)
  bool return_ssh_private_key = 8; // GAP-128: opt-in; response carries the private key ONLY when true
  // GAP-116 per-spawn safety preset override ("open" | "standard" |
  // "hardened"). Empty = defer to BUNKERD_SAFETY_PRESET, then the config
  // global, then the built-in default. An unknown name is a hard error —
  // never a silent fallback.
  string safety_preset = 9;
  // MOUNT-006: requested mount driver (e.g. "sshfs"). Empty = the server
  // default (sshfs). An unknown driver name REFUSES the spawn with a named
  // error (CodeInvalidArgument) — never a silent fallback to sshfs.
  string mount_driver = 10;
}

// ── Image specification (GAP-064) ─────────────────────────────
//
// A small declarative, additive-only customization of the per-agent image:
// base image (from the server's allowlist) plus package-add directives for the
// registered package managers (apt, go, npm, pip, cargo, gem, composer — the
// authoritative list is the server's manager registry, internal/imagespec).
// The server validates BEFORE any side effect; rejected specs return
// CodeInvalidArgument without creating the user, allocating ports, starting
// dockerd, or building an image. Arbitrary Dockerfile text is NOT
// representable in this grammar (no FROM/USER/EXPOSE/VOLUME/ENV/RUN rewrites,
// no curl|sh, no mounts or namespace escapes).
message ImageSpec {
  string base = 1;               // Optional: allowed base image (server default if empty)
  repeated PackageAdd packages = 2; // Optional: package-add directives
}

// One constrained package-install directive.
message PackageAdd {
  // manager is a registered manager name ("apt" | "go" | "npm" | "pip" |
  // "cargo" | "gem" | "composer"); the server rejects any name it has no
  // registry row for.
  string manager = 1;
  // packages are package names with an optional manager-specific version
  // suffix (=version for apt, @version for go/npm, a PEP 440 specifier for
  // pip, crate@requirement for cargo, name@requirement for gem,
  // vendor/package:constraint for composer). Every token is rendered
  // single-quoted into the image's RUN line.
  repeated string packages = 2;
}

// ── Mount driver seam (MOUNT-006) ──────────────────────────────
//
// The mount command used to be one opaque, sshfs-shaped string
// (`sshfs_mount`). MountSpec carries an EXPLICIT driver identity ALONGSIDE
// that string so a future mount driver (rclone, FUSE/io_uring) can be
// selected on spawn/mount without guessing from the command text.
//
// Backward compatibility contract: `sshfs_mount` keeps its field number and
// its exact semantics (the sshfs command string), and remains the ONLY thing
// an older client reads. A client that ignores MountSpec therefore mounts
// via sshfs exactly as before; a client that reads MountSpec dispatches per
// driver and must refuse an unregistered driver by name, never silently
// falling back to sshfs.
message MountSpec {
  // driver is the registered mount-driver name that produced `command`.
  // Empty means the producer predates the seam and the command is sshfs.
  string driver = 1;
  // command is the stored, opaque mount command for that driver. For sshfs
  // it is byte-identical to the legacy `sshfs_mount` string.
  string command = 2;
}

message SpawnAgentResponse {
  string agent_id = 1;
  string docker_host_ssh = 2;    // DOCKER_HOST=ssh://agent-N@host
  string docker_host_tunnel = 3; // ssh -L 2376:... command
  string sshfs_mount = 4;        // sshfs mount command
  string public_url = 5;         // https://agent-N.trycloudflare.com
  uint32 port_range_start = 6;
  uint32 port_range_end = 7;
  // Deprecated: only populated when return_ssh_private_key=true (GAP-128).
  // The default response carries NO key material; callers fetch it explicitly
  // via the master-credential-gated GetAgentKey RPC.
  string ssh_private_key = 8 [deprecated = true];
  ResourceLimits limits = 9;
  string expires_at = 10;
  string tailnet_ip = 11;
  string api_key = 12;             // Agent-scoped opaque API sub-key (if auth enabled)
  string image = 13;               // Customized image ref when image_spec was supplied (GAP-064)
  // MOUNT-006: explicit driver identity for the mount command. ADDITIVE:
  // `sshfs_mount` above keeps its number and semantics so an older client
  // (which reads only that field) keeps mounting via the sshfs default.
  MountSpec mount_spec = 14;
}

// ── Agent SSH key retrieval (GAP-128) ─────────────────────────
//
// The spawn response no longer carries private key material by default.
// Callers that need a local copy of the agent's SSH key fetch it explicitly
// with this RPC. It sits on the Bunkerd service, so it is authorized exactly
// like the other admin-capable RPCs (master token / master JWT only — agent
// scoped sub-keys are rejected by the master-only interceptor).
message GetAgentKeyRequest {
  string agent_id = 1;
}

message GetAgentKeyResponse {
  string agent_id = 1;
  string ssh_private_key = 2;      // PEM private key (server-side persisted copy)
}

message DestroyAgentRequest {
  string agent_id = 1;
  bool force = 2;                // Force destroy even if running
}

message DestroyAgentResponse {
  string agent_id = 1;
  string status = 2;             // destroyed, not_found, error, home_retained, live_processes, userdel_failed
}

// ── Renewal drift report (DF-BUNKER-34) ─────────────────────────
//
// A renewal that keeps the stable agent id keeps the home path too, but the
// artifacts INSIDE the home (systemd --user units, cron entries, shell/env
// and config files) can still carry the PREVIOUS home path from before the
// first stable renewal. The drift report scans those classes for references
// to a given old-home path and REPORTS every hit — it never rewrites (an
// automatic rewrite of a user's service units is a data mutation the daemon
// has no authority over; the recipe documents the operator's rewrite).
message RenewalDriftRequest {
  string agent_id = 1;   // the agent whose home is scanned
  // old_home is the path searched for (the previous home path). REQUIRED:
  // a scan with no needle would read as "clean" without proving anything.
  string old_home = 2;
  // home is the directory to scan; empty = the agent's own home
  // (/home/bunker-<agent_id>).
  string home = 3;
}

message RenewalDriftResponse {
  string agent_id = 1;
  string home = 2;       // the home that was scanned
  string old_home = 3;   // the path searched for
  uint32 files_scanned = 4;
  repeated RenewalDriftHit hits = 5;
  repeated string unreadable = 6; // files that exist but could not be read
  // summary is the operator-facing one-line-per-hit rendering (what the CLI
  // prints verbatim).
  string summary = 7;
}

// RenewalDriftHit is one stale-path reference found in an agent-side file.
message RenewalDriftHit {
  string file = 1;  // path inside the agent home (relative)
  uint32 line = 2;  // 1-based line number
  string text = 3;  // the trimmed line content
}

// ── Lifecycle control (GAP-071) ───────────────────────────────
//
// Stop/Start/Restart pause and resume an existing agent without destroying
// it: the Linux user, home directory, container and allocated port range are
// kept across a stop, so a stopped agent can be resumed (start) or recovered
// from a wedged session (restart) instead of being torn down and re-created.
// Every response mirrors DestroyAgentResponse's shape and reports a "status"
// from a fixed vocabulary — "stopped" / "already_stopped" / "started" /
// "already_running" / "restarted" / "not_found" — and an unknown agent id
// never panics: it reports "not_found".

message StopAgentRequest {
  string agent_id = 1;
}

message StopAgentResponse {
  string agent_id = 1;
  string status = 2;             // stopped, already_stopped, not_found
}

message StartAgentRequest {
  string agent_id = 1;
}

message StartAgentResponse {
  string agent_id = 1;
  string status = 2;             // started, already_running, not_found
}

message RestartAgentRequest {
  string agent_id = 1;
}

message RestartAgentResponse {
  string agent_id = 1;
  string status = 2;             // restarted, not_found
  // Heartbeat expiry after the restart's TTL reset (RFC3339, server-local
  // timezone) — the same field name and format HeartbeatAgentResponse uses.
  string expires_at = 3;
}

message ListAgentsRequest {
  string status_filter = 1;      // Optional: running, stopped, all
  uint32 page_size = 2;
  string page_token = 3;
}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  AgentSummary agent = 1;
}

message AgentMetricsRequest {
  string agent_id = 1;
}

message AgentMetricsResponse {
  string agent_id = 1;
  string status = 2;
  double cpu_usage_percent = 3;
  uint64 memory_used_bytes = 4;
  uint64 memory_limit_bytes = 5;
  uint64 disk_used_bytes = 6;
  // disk_limit_bytes is the agent's PER-FILE size cap (systemd LimitFSIZE /
  // RLIMIT_FSIZE), NOT a total-disk limit: it is echoed from the agent's
  // ResourceLimits.disk_max_bytes. Compare it against disk_used_bytes only
  // as two separate facts — a used-vs-cap ratio would assert an enforcement
  // that does not exist (DF-BUNKER-54; total-disk quotas are GAP-161).
  uint64 disk_limit_bytes = 7;
  uint32 docker_containers = 8;
  string uptime = 9;
  bool host_level_fallback = 10;  // true when metrics are HOST values, not the agent's own cgroup
}

message HeartbeatAgentRequest {
  string agent_id = 1;
}

message HeartbeatAgentResponse {
  string agent_id = 1;
  string expires_at = 2;
  bool acknowledged = 3;
}

message ExecAgentRequest {
  string agent_id = 1;
  string command = 2;
  repeated string args = 3;
  uint32 timeout_seconds = 4;
  bool raw = 5;                   // Bypass shell interpretation; exec directly
  string script_content = 6;      // Optional: upload and execute this script
  bytes stdin_payload = 7;        // Optional: piped to the command's stdin
  ExecEncoding response_encoding = 8; // Optional: how stdout/stderr are returned
  // Optional: per-request raw-output cap in bytes (each direction). 0 = server
  // default (512MiB). Lets a cautious caller lower the cap without a server
  // config change; can never RAISE it past the server ceiling.
  uint64 response_cap_bytes = 9;
}

// How the response carries stdout/stderr. TEXT (zero) is the default and is
// byte-identical to pre-GAP-094 behavior; BASE64 lets a caller ship non-UTF8
// bytes through anything that insists on text without corruption.
enum ExecEncoding {
  EXEC_ENCODING_TEXT = 0;
  EXEC_ENCODING_BASE64 = 1;
  // The response carries a truncation note instead of silently dropping bytes.
  // A cap response names the cap and how to narrow the query.
}

message ExecAgentResponse {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
  }
  int32 exit_code = 3;
  // Set on the FINAL frame when any output was truncated: names the cap in
  // bytes and the remedy. Never set when nothing was dropped.
  string truncation_notice = 4;
}

message RunAgentRequest {
  string agent_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  bool detach = 5;                  // Start as persistent background unit
  uint32 timeout_seconds = 6;
  string name = 7;                  // Optional name suffix for the run unit
  // GAP-116 per-spawn safety preset override (same grammar and precedence as
  // SpawnAgentRequest.safety_preset). Empty = defer to env > config > default.
  string safety_preset = 8;
}

message RunAgentResponse {
  string run_id = 1;
  string status = 2;                // "running", "completed", "failed"
  int32 exit_code = 3;              // -1 for detached (still running)
  string unit_name = 4;             // systemd unit name for detached runs
}

message GetInfoRequest {}
message GetInfoResponse {
  string agent_id = 1;
  string status = 2;
  string docker_host = 3;
  string public_url = 4;
  ResourceLimits limits = 5;
  string expires_at = 6;
}

// ── Audit trail ────────────────────────────────────────────────

// QueryAuditRequest carries optional filters for the audit trail. All
// filters are ANDed; empty filters match everything. since/until are
// RFC3339 timestamps (RFC3339Nano accepted) compared against the record's
// ts field.
message QueryAuditRequest {
  string agent_id = 1;  // exact match on agent_id ("" = all)
  string method = 2;    // substring match on the procedure, e.g. "/bunker.v1.Bunkerd/SpawnAgent" ("" = all)
  string since = 3;     // RFC3339 lower bound (inclusive)
  string until = 4;     // RFC3339 upper bound (inclusive)
  uint32 limit = 5;     // max records to return, most recent first (0 = no limit)
}

// AuditRecord is one audit log entry. Field names mirror the JSONL keys
// written by the daemon (internal/audit Record), so a remote query and a
// local export of the same log are byte-identical in content.
message AuditRecord {
  string ts = 1;          // RFC3339Nano UTC timestamp
  string caller = 2;      // token/agent identity
  string method = 3;      // full connect procedure, e.g. /bunker.v1.Bunkerd/SpawnAgent
  string remote_addr = 4; // client address as seen by the server
  string agent_id = 5;    // target agent of the request ("" when none)
  int64 duration_ms = 6;  // wall time from request start to completion
  string outcome = 7;     // "ok" or the connect error code, e.g. "not_found"
  string summary = 8;     // human-readable request summary
  string hash = 9;        // SHA-256 hex digest of the canonical record line
  string prev_hash = 10;  // hash of the previous record in the chain
}

message QueryAuditResponse {
  repeated AuditRecord records = 1;
}

// ── Key lifecycle (GAP-132) ─────────────────────────────────────

// RotateJWTSecretRequest asks the daemon to rotate the HS256 signing secret.
// overlap_seconds bounds the dual-accept window: for that long after the
// rotation the RETIRED secret still validates existing tokens (so in-flight
// clients never see an auth failure), after which it is rejected. 0 selects
// the daemon default. The window is capped server-side (hard maximum
// 3600s); values beyond the cap are clamped, not rejected.
message RotateJWTSecretRequest {
  uint32 overlap_seconds = 1;
}

// RotateJWTSecretResponse carries the NEW secret exactly once. It is never
// stored in plaintext anywhere retrievable again — persist it operator-side
// (or let the daemon's own 0600 secret file carry it) before losing this
// response. rotated_at is RFC3339 UTC; overlap_seconds reports the effective
// window actually applied (after clamping).
message RotateJWTSecretResponse {
  string jwt_secret = 1;
  string rotated_at = 2;
  uint32 overlap_seconds = 3;
  // Previous secret's fingerprint (sha256, first 12 hex chars) so an
  // operator can correlate which secret was retired — never the value.
  string previous_fingerprint = 4;
}

// RevokeKeyRequest names an API sub-key by its key ID (as reported by
// spawn / KeyList). Revocation is immediate: tokens/credentials issued under
// the key stop validating before the response is sent.
message RevokeKeyRequest {
  string key_id = 1;
}

message RevokeKeyResponse {
  string key_id = 1;
  // "revoked" on success.
  string status = 2;
}

// KeyListRequest lists active API sub-keys, optionally scoped to one agent.
message KeyListRequest {
  // Optional exact agent_id filter ("" = all keys).
  string agent_id = 1;
}

// KeyInfo is one key in a KeyListResponse. Metadata only — never a token,
// hash, or any secret material.
message KeyInfo {
  string key_id = 1;
  string agent_id = 2;
  string created_at = 3;   // RFC3339
  string expires_at = 4;   // RFC3339
  bool revoked = 5;        // revoked keys are listed with revoked=true until they expire out
}

message KeyListResponse {
  repeated KeyInfo keys = 1;
}

# Bunker daemon configuration example.
#
# Copy to /etc/bunkerd/config.yaml and edit before first start:
#   cp config.example.yaml /etc/bunkerd/config.yaml
#
# Every key below matches the README quick-start config and the daemon's
# built-in defaults (internal/config/config.go). Unset keys fall back to
# those defaults; env overrides use BUNKERD_<SECTION>_<KEY> (e.g.
# BUNKERD_SERVER_GRPC_ADDR, BUNKERD_AUTH_TOKEN).

server:
  grpc_addr: ":9090"          # gRPC listen address
  rest_addr: ":8080"          # REST (connect-go) listen address
  request_timeout: 300s       # per-request timeout

# TLS for the gRPC/REST listeners. Leave disabled for plaintext.
#
# self_signed: true makes the daemon generate its own certificate on first
# start (tlsutil.GenerateSelfSignedCert) for the hosts below, and the CLI pins
# it on first connect — so clients verify the daemon WITHOUT disabling
# verification:
#   bunker connect --tls self-signed https://<host>:9090
# See the README section "TLS: the secure path is the easy path" for the pin,
# rotation and re-pin rules.
# tls:
#   enabled: false
#   cert_file: ""
#   key_file: ""
#   auto_tls: false
#   self_signed: false
#   domain: ""
#   mtls: false
#   ca_file: ""
#   verify_cn: ""
#   hosts: ["localhost", "127.0.0.1"]  # names/IPs in the generated cert

auth:
  enabled: true               # require the master token on every request
  token: "your-master-token-here"  # CHANGE ME — also used by `bunker connect`
  # GAP-129 secret storage: keep the credential OUT of this file instead of
  # inlining it. Precedence (highest last): inline < *_file path < env-file.
  #   token_file: /etc/bunkerd/secrets/token          # mode 0600
  #   jwt_secret_file: /etc/bunkerd/secrets/jwt_secret
  #   BUNKER_AUTH_TOKEN_FILE       (env) — same, but wins over the config
  #   BUNKER_AUTH_JWT_SECRET_FILE  (env)
  # A set-but-unreadable path is a hard startup error (no silent fallback).
  # jwt_secret is auto-generated on first boot when it is empty and a token
  # exists: persisted 0600 at $BUNKER_SECRETS_DIR/jwt_secret (default
  # ~/.config/bunkerd/secrets/) and never rotated on restart.
  # jwt_secret: ""            # optional; auto-generated when empty
  # jwt_ttl: 6h

agent:
  ssh_dir: /etc/bunkerd/ssh   # server-side agent SSH key storage
  max_agents: 100
  default_cpu_quota: 2.0           # 2 CPU cores
  default_memory_bytes: 4294967296  # 4 GB
  default_disk_bytes: 21474836480   # 20 GB
  default_max_processes: 4096
  default_max_open_files: 65536
  default_max_docker_containers: 10
  port_range_start: 10000
  port_range_end: 19999
  port_range_per_agent: 100
  # default_ttl: 6h           # default agent TTL (\\d+[hmd] format, e.g. 6h/90m/7d)

  # Host-level cache for downloaded rootless Docker installers (GAP-091).
  # With a valid cached artifact (~93MB from get.docker.com) a fresh-agent
  # spawn skips the network download entirely — retries no longer depend on
  # get.docker.com throughput. The daemon (root) creates the directory as
  # 0755 and stores one installer file in it. Empty string ("") disables
  # the cache and restores the legacy uncached download path.
  # Env override: BUNKER_ROOTLESS_INSTALLER_CACHE_DIR (empty = unset).
  # rootless_installer_cache_dir: /var/cache/bunker/rootless-installer  # default

  # Durable agent registry (GAP-070). Append-only JSONL lifecycle log
  # (spawn / heartbeat / destroy) replayed at startup, so agents survive a
  # daemon restart. Mode 0600, size-capped with rotation.
  # A daemon that cannot open this file REFUSES TO START: every spawn it
  # accepted would otherwise be forgotten by the next replay.
  # Env overrides: BUNKERD_AGENT_REGISTRY_ENABLED / _PATH / _MAX_BYTES /
  # _MAX_BACKUPS / _KNOWN_ID_CAP.
  registry:
    enabled: true                          # false = pre-GAP-070 in-memory behavior
    path: /var/lib/bunkerd/agents.jsonl    # active log; rotated to .1 .2 .3
    max_bytes: 5242880                     # 5 MiB per file before rotation
    max_backups: 3                         # agents.jsonl.1 .. agents.jsonl.3
    known_id_cap: 10000                    # destroyed-ID index kept by compaction

  # Destroy-time home archive retention (INFRA-BACKUP-01). With the default
  # destroy_home_policy: archive, every destroy writes one tarball of the
  # agent home into destroy_archive_dir — and destroy archives have no
  # retention otherwise: 1394 tarballs (~130G) filled a 150G disk once
  # (2026-09-21 incident). destroy_archive_keep bounds the archive dir to
  # the newest N tarballs after every successful archive; an explicit 0
  # disables pruning entirely and negative values behave like 0.
  # destroy_archive_max_bytes is an optional total-size cap: when the sum of
  # the archives exceeds it, the OLDEST are deleted first — but never down
  # to zero (the single newest archive always survives). 0 = disabled.
  # Env overrides: BUNKERD_AGENT_DESTROY_ARCHIVE_KEEP /
  # BUNKERD_AGENT_DESTROY_ARCHIVE_MAX_BYTES (the archive dir itself:
  # BUNKERD_AGENT_DESTROY_ARCHIVE_DIR).
  destroy_archive_keep: 20               # 0 = disable keep pruning (explicit opt-out)
  destroy_archive_max_bytes: 0            # total-size cap in bytes; 0 = disabled
  # destroy_archive_dir: /var/backups/bunker  # default

  # Per-agent isolation boundary (GAP-075). Every agent gets an ENFORCED
  # private /tmp: SSH sessions through pam_namespace, transient systemd units
  # through --property=PrivateTmp=yes. There is no toggle — an isolation
  # boundary that can be switched off silently is not a boundary.
  #
  # agent_group is the isolation group every agent joins. The sshd block keys
  # on the reserved `bunker-*` NAME pattern and then REQUIRES this group and the
  # session user's membership of it (a root-owned pam_exec precondition runs
  # before pam_namespace): root and ordinary operator accounts are not
  # agent-named, so they are jumped over the whole block and keep the host /tmp
  # (mounting the module host-wide would polyinstantiate every non-root user —
  # that was the rejected design). A missing group or a lost membership DENIES
  # the agent session rather than falling back to the shared /tmp. The host half
  # is installed by `bunker host-provision`. Membership is granted to every agent
  # at spawn whether or not the exchange point below is enabled, and a spawn that
  # cannot grant it fails closed.
  #
  # The ONLY sanctioned cross-agent exchange point is shared_scratch_root: the
  # daemon creates one directory per agent there, group-readable by every
  # agent (setgid) and bounded by a kernel-enforced tmpfs size. A scratch
  # directory whose bounded filesystem cannot be mounted is NOT created (no
  # unbounded fallback).
  #
  # Env overrides: BUNKERD_AGENT_ISOLATION_AGENT_GROUP / _SHARED_SCRATCH_ENABLED
  # / _ROOT / _GROUP / _PER_AGENT_BYTES / _PRIVATE_TMP_ROOT.
  isolation:
    agent_group: bunker-agents                       # isolation group (verified membership + exchange)
    shared_scratch_enabled: true                     # exchange point on/off
    shared_scratch_root: /srv/bunker-share           # root-owned, setgid, mode 2750 (NO group/world write)
    shared_scratch_group: bunker-agents              # legacy alias of agent_group
    shared_scratch_per_agent_bytes: 268435456        # 256 MiB cap per agent (tmpfs)
    private_tmp_root: /var/lib/bunkerd/agent-tmp      # pam_namespace /tmp instances

  # Startup reconciliation between the replayed registry and system users.
  #   destroy (default): a bunker-* user the registry does not know is removed.
  #   adopt:             it is re-registered and its EXACT persisted port
  #                      reservation is restored (no double allocation).
  #
  # adopt applies ONLY to orphans carrying readable, valid, free port
  # metadata (<home>/.bunker/ports: a legal pool sub-range that no other
  # agent already holds — adoption is exact-port or nothing). An orphan
  # WITHOUT that metadata is DESTROYED in both modes: adoption never
  # guesses a reservation, and a leftover user is cheaper to recreate than
  # a port collision. The startup log line names the reason ("adopt failed,
  # destroying orphan instead" / "no readable port metadata at ...").
  # Env override: BUNKERD_AGENT_RECONCILIATION_MODE.
  reconciliation:
    mode: destroy

# Per-agent image customization (GAP-064): secure package-add specs on spawn.
# image_spec:
#   enabled: true                      # reject spawns carrying a spec when false
#   cache_dir: /var/cache/bunkerd/imagespec  # per-agent build cache
#   build_timeout: 20m                 # hard bound per rootless build

# Daemon-side audit trail: append-only JSONL log of every authenticated RPC
# (file mode 0600; never contains token values).
audit:
  enabled: true                    # log every authenticated RPC
  path: /var/log/bunkerd/audit.log  # append-only JSONL audit log
# GAP-073 retention hardening (both opt-in, OFF by default):
# ship_to ships each ROTATED audit segment to a remote endpoint so a root
# attacker cannot complete a cover-up by deleting the local backups.
# Supported: https:// or http:// webhook (segment POSTed as the request
# body, Content-Type application/x-ndjson, header X-Bunker-Chain-Head) and
# syslog://host[:port] (RFC 3164 over UDP; one datagram per record line +
# a SEAL datagram — lossless copies should use the webhook). Shipping is
# fire-and-forget: a dead endpoint is retried with backoff from a bounded
# queue and never blocks or fails the audit write. Env override:
# BUNKERD_AUDIT_SHIP_TO.
#  ship_to: https://collector.example.net/v1/audit
# seal_key, when set, makes every rotation append a chained SEAL record to
# the fresh log: HMAC-SHA256(key=seal_key, msg=<sealed chain head>). Holders
# of shipped copies can use it to prove a local file was truncated or
# replaced. Env override: BUNKERD_AUDIT_SEAL_KEY. Keep the key SECRET and
# back it up with the shipped copies.
#  seal_key: ""

# Containment disclosure (GAP-067): admin-controlled, HIDDEN BY DEFAULT.
# When enabled, every agent session gets BUNKER_SANDBOX=1 and allowed
# system-info probes (uname, hostname, uptime, free, df, id, whoami,
# lsb_release, cat /etc/os-release) get one self-describing marker line
# appended to stdout:
#   [bunker: managed sandbox environment — containment active]
# Command exit codes are preserved. When false (default) behavior is
# byte-identical to a daemon without the feature. Env override:
# BUNKERD_CONTAINMENT_DISCLOSURE=true (overrides the config file).
# See specs/containment-disclosure.md.
containment:
  disclosure: false

# Safety preset (GAP-116 plumbing; GAP-117 naming): the daemon-wide default
# safety profile every agent spawn resolves against. Precedence: per-spawn
# `bunker spawn --preset` flag > BUNKERD_SAFETY_PRESET env > this config
# global > built-in default "standard".
# The shipped tier "standard" (GAP-117) carries exactly today's five-knob
# baseline: CPUQuota 2.0, MemoryMax 4 GiB, TasksMax 4096, LimitNOFILE 65536,
# LimitFSIZE 20 GiB (the agent.default_* values, applied at both the
# user-<uid>.slice drop-in and the dockerd transient unit).
# "open" and "hardened" remain accepted names that resolve to the same knob
# set today — GAP-118/119 differentiate the tiers, so a config that already
# says safety.preset: open keeps working unchanged. An unknown name REFUSES
# TO START: fail loud, never a silent fallback. Empty/unset = the built-in
# default "standard", which is byte-identical to pre-GAP-116 behavior.
# Env override: BUNKERD_SAFETY_PRESET (overrides this config value).
safety:
  preset: ""

